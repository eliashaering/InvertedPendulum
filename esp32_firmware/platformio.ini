[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
build_flags = 
    -O3 
    -std=gnu++17
    #-D LOG_LOCAL_LEVEL=ESP_LOG_INFO
build_unflags = -std=gnu++11

[env:native]
platform = native
test_framework = unity
build_flags = -I src
build_src_filter = -<*>
    